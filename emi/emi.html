<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swetha Luxury Cars - EMI Calculator</title>
<link rel="stylesheet" href="emi.css">
</head>

<body>

<header>
    <h1>💰 EMI Calculator</h1>
    <p>Calculate Your Car Loan EMI</p>
</header>

<div class="emi-container">

    <input type="number" id="amount" placeholder="Car Price (₹)">

    <input type="number" id="rate" placeholder="Interest Rate (%)">

    <input type="number" id="years" placeholder="Loan Tenure (Years)">

    <button onclick="calculateEMI()">Calculate EMI</button>

    <div id="result"></div>

</div>

<script src="emi.js"></script>

</body>
</html>
